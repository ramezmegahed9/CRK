name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate leads JSON
        run: python3 -c "import json;json.load(open('data/leads.json'))"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTP (lftp mirror)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          mirror -R --verbose --parallel=2 \
            --exclude-glob .git* --exclude ^\.git/ --exclude ^\.github/ \
            --exclude ^storage/ \
            ./ "$FTP_DIR"
          quit
          EOF
